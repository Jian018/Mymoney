<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta

  /><meta name="theme-color" content="#f5f6f2" /><title>
    My Money · Offline</title

  <main>
    <span>MY MONEY ↗</span>

    <button onclick="location.replace('/')">Try again</button>
